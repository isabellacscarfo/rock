<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rock Styles Playlist</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 0 auto; padding: 1rem; line-height: 1.4; }
  h1 { font-size: 1.3rem; margin: 0 0 .5rem; }
  h2 { font-size: 1rem; margin: 1.2rem 0 .3rem; }
  #controls { position: sticky; top: 0; background: Canvas; padding: .5rem 0; border-bottom: 1px solid GrayText; }
  #main { display: flex; gap: .5rem; }
  #main button { flex: 1; font-size: 1.3rem; padding: 1.1rem .5rem; }
  #chapters, #narration { margin-top: .5rem; }
  #chapters { display: flex; gap: .4rem; }
  #chapters button { flex: 1 1 auto; font-size: 1.15rem; padding: .75rem .3rem; }
  #controls #narration, #controls #extras { font-size: .95rem; padding: .3rem .6rem; margin-top: .5rem; }
  #now { font-weight: bold; margin-top: .4rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #now, #status, #note { min-height: 1.4em; }   /* fixed height: text changes never move the page */
  #list button.song { display: block; width: 100%; text-align: left; padding: .5rem; margin: 6px 0 0; font: inherit; }
  #list button.song[aria-current] { font-weight: bold; outline: 2px solid; }
  details { margin: 0 0 0 .5rem; }
  summary { cursor: pointer; padding: .2rem 0; }
  h3 { font-size: .9rem; margin: .6rem 0 .2rem; }
  details p { margin: .2rem 0; }
  textarea { width: 100%; box-sizing: border-box; font: inherit; }
  #spotify { margin-top: 2rem; border-top: 1px solid GrayText; }
  #editing { margin-top: 1rem; }
  input { font: inherit; padding: .3rem; }
</style>
</head>
<body>
<h1>Rock Styles Playlist</h1>
<div id="controls">
  <div id="main"><button id="prev">Previous</button><button id="pp">Play</button><button id="skip">Skip</button></div>
  <div id="chapters"></div>
  <button id="narration">Narration: short</button> <button id="extras">Extra songs: off</button>
  <div id="now"></div>
  <div id="status"></div>
  <div id="note"></div>
</div>
<div id="list"></div>
<div id="spotify"></div>
<div id="editing"></div>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
