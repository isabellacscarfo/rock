<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rock Styles Playlist</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 0 auto; padding: 1rem; line-height: 1.4; }
  h1 { font-size: 1.3rem; margin: 0 0 .5rem; }
  h2 { font-size: 1rem; margin: 1.2rem 0 .3rem; }
  #controls { position: sticky; top: 0; background: Canvas; padding: .5rem 0; border-bottom: 1px solid GrayText; }
  #controls button { font-size: 1.1rem; padding: .6rem 1rem; margin-right: .4rem; }
  #now { font-weight: bold; margin-top: .4rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #now, #status, #note { min-height: 1.4em; }   /* fixed height: text changes never move the page */
  #list button { display: block; width: 100%; text-align: left; padding: .5rem; margin: 2px 0; font: inherit; }
  #list button[aria-current] { font-weight: bold; outline: 2px solid; }
  input { font: inherit; padding: .3rem; }
</style>
</head>
<body>
<h1>Rock Styles Playlist</h1>
<div id="spotify"></div>
<div id="controls">
  <button id="prev">Previous</button><button id="pp">Play</button><button id="skip">Skip</button>
  <div id="now"></div>
  <div id="status"></div>
  <div id="note"></div>
</div>
<div id="list"></div>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
